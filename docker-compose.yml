#
# Standalone development build test version for docker.
#

services:
  tadex-nginx-proxy:
    container_name: tadex-nginx-proxy
    build:
      context: nginx-proxy
    ports:
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - "/etc/nginx/vhost.d"
      - "/usr/share/nginx/html"
      - "/etc/nginx/certs"

  tadex-ui:
    container_name: tadex-ui
    build:
      context: ui
    ports:
      - 7210:7210
    environment:
      VIRTUAL_HOST: tadex.localhost
      VIRTUAL_PORT: 7210
    command: pnpm run docker
