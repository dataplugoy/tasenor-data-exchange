#
# Standalone development build test version for docker.
#

volumes:
  tadex_db:

services:
  tadex-nginx-proxy:
    container_name: tadex-nginx-proxy
    build:
      context: nginx-proxy
    ports:
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - "/etc/nginx/vhost.d"
      - "/usr/share/nginx/html"
      - "/etc/nginx/certs"

  tadex-db:
    container_name: tadex-db
    build:
      context: database
    volumes:
      - tadex_db:/var/lib/postgresql/data
    ports:
      - ${DB_PORT:-7300}:${DB_PORT:-7300}
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: 02u3QD2e3wxssfdr3sxds
      POSTGRES_DB: tadex
    command: -p ${DB_PORT:-7300}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p ${DB_PORT:-7300} -U dev -d tadex"]
      interval: 2s
      timeout: 5s
      retries: 60

  tadex:
    container_name: tadex
    build:
      context: ui
    ports:
      - 7301:7301
    environment:
      PORT: 7301
      VIRTUAL_HOST: tadex.localhost
      VIRTUAL_PORT: 7301
      NODE_ENV: dev
      API_URL: http://tadex-api:7302
    command: pnpm run docker

  tadex-api:
    container_name: tadex-api
    build:
      context: backend
    ports:
      - 7302:7302
    environment:
      PORT: 7302
      NODE_ENV: dev
      DATABASE_URL: postgres://dev:02u3QD2e3wxssfdr3sxds@tadex-db:7300/tadex
      VIRTUAL_HOST: tadex-api.localhost
      VIRTUAL_PORT: 7302
    depends_on:
      tadex-db:
        condition: service_healthy
    command: pnpm run docker

  tadex-web:
    container_name: tadex-web
    build:
      context: web
    ports:
      - 7304:7304
    environment:
      PORT: 7304
      NODE_ENV: dev
      VIRTUAL_HOST: tadex-web.localhost
      VIRTUAL_PORT: 7304
    command: pnpm run docker
